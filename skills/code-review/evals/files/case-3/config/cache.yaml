l1_max_entries: 2048

namespaces:
  layer:
    l1_ttl_seconds: 10
    l2_ttl_seconds: 900
  style:
    l1_ttl_seconds: 30
    l2_ttl_seconds: 3600
  manifest:
    l1_ttl_seconds: 5
    l2_ttl_seconds: 300
  tileset:
    l1_ttl_seconds: 15
    l2_ttl_seconds: 900
  attribution:
    l1_ttl_seconds: 60
    l2_ttl_seconds: 86400
  legend:
    l1_ttl_seconds: 60
    l2_ttl_seconds: 86400
  glyphs:
    l1_ttl_seconds: 120
    l2_ttl_seconds: 86400
  sprites:
    l1_ttl_seconds: 120
    l2_ttl_seconds: 86400
  bounds:
    l1_ttl_seconds: 30
    l2_ttl_seconds: 3600

redis:
  url_env: REDIS_URL
  socket_timeout_seconds: 0.25
  cluster_mode: true

warmup:
  enabled: true
  namespace: layer
  top_n: 300
