      prompt: "You are a neutral skill router. You will receive (1) a catalog of available skills and (2) a user request. Choose the single best skill for the request. If no skill clearly fits, return selected_skill=null and action=\\"clarify\\".\n\nRespond with ONLY a single JSON object and no other text, of the form:\n{\\"selected_skill\\": \\"<skill name or null>\\", \\"action\\": \\"apply\\"|\\"clarify\\", \\"rationale\\": \\"<one sentence>\\"}\n\n=== CATALOG ===\nAvailable skills (name — one-line purpose):\n- adversarial-pr-review — Parent-validated adaptive adversarial PR review — requires a fresh, independent read-only subagent, partitions larger diffs into bounded tracks, and re-reviews affected tracks until convergence. Use when the user explicitly requests an adversarial or multi-agent review, or when the target repository policy explicitly requires adversarial review before publication.\n- architecture-review — Review a repository or subsystem's design and recommend whether and how its structure should evolve — Keep, Evolve, Replace, or Greenfield options, refactor-versus-rewrite, and what-to-tackle-first triage. Use implementation-planning once the direction is already chosen.\n- code-review — Review a diff, pull request, branch, subsystem, or bounded repository surface for concrete correctness and regression defects, reporting any defect found — security ones included. Use when the deliverable is the code review itself; use security-review when a dedicated vulnerability assessment is the primary task.\n- documentation-review — Audit and update project documentation against current implementation, build/configuration, tests, CI, and authoritative external references when needed. Use for documentation audits, documentation sync, stale or incorrect claims, runbooks, guides, READMEs, diagrams, or project-local guidance. Do not use for missing domain depth, anti-patterns, or checklist gaps in a skill (use skill-reviewer); this skill verifies factual agreement with source/build/CI truth.\n- frontend-quality-review — Review an implemented frontend, UI, or UX surface for evidence-backed product quality, interaction, accessibility, responsive, state, and performance defects. Use for explicit UI quality or accessibility reviews; do not use for ordinary backend code review, net-new implementation, or optional visual redesign without a demonstrated defect. Report by default; do not edit or automate a browser without separate authorization.\n- implementation-planning — Convert approved requirements or design into an execution-ready implementation plan that another agent can carry out without rediscovering the design. Use after design decisions are settled. Do not use to define requirements (use requirements-and-design) or review an existing design (use architecture-review); this skill plans the build, it does not decide what to build or implement it.\n- review-feedback-resolution — Resolve incoming review feedback (PR comments, code/architecture/security review findings, or audits) against repository evidence: disposition each item and apply only accepted fixes. Use when a review has returned comments to act on. Do not use to find defects (use code-review, security-review, or architecture-review); this skill receives findings, it does not generate them.\n- security-review — Perform a dedicated security vulnerability review of code, configuration, trust boundaries, or agent workflows, tracing untrusted input and privilege paths to exploitable sinks. Use when security risk is the requested deliverable — not merely because code under ordinary review touches auth, tokens, or secrets.\n- systematic-debugging — Diagnose a reproducible bug, test failure, build failure, integration failure, performance regression, or other unexpected behavior by finding its root cause before proposing or implementing a fix. Do not use for planned feature work without an observed failure.\n- threat-modeling — Build a repository-grounded threat model for an application, service, API, agent workflow, or architecture by mapping assets, actors, trust boundaries, entrypoints, attacker capabilities, abuse paths, and mitigations. Use only for explicit threat-model, attack-surface, DFD, STRIDE, PASTA, LINDDUN, or abuse-path requests; use security-review for ordinary vulnerability review. Report by default and do not probe external systems.\n\n=== USER REQUEST ===\nThe PR fixes an auth bug but also changes how callers are authorized. I mainly need to know whether the change is correct enough to merge.\n"
      catalog_names_json: "[\\"adversarial-pr-review\\", \\"architecture-review\\", \\"code-review\\", \\"documentation-review\\", \\"frontend-quality-review\\", \\"implementation-planning\\", \\"review-feedback-resolution\\", \\"security-review\\", \\"systematic-debugging\\", \\"threat-modeling\\"]"
      expected_skill: "code-review"
    assert:
      - type: python
        value: file://assertions/protocol.py:check_route_decision
