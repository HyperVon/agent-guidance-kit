t with source/build/CI truth.\n- frontend-quality-review — Review an implemented frontend, UI, or UX surface for evidence-backed product quality, interaction, accessibility, responsive, state, and performance defects. Use for explicit UI quality or accessibility reviews; do not use for ordinary backend code review, net-new implementation, or optional visual redesign without a demonstrated defect. Report by default; do not edit or automate a browser without separate authorization.\n- implementation-planning — Convert approved requirements or design into an execution-ready implementation plan that another agent can carry out without rediscovering the design. Use after design decisions are settled. Do not use to define requirements (use requirements-and-design) or review an existing design (use architecture-review); this skill plans the build, it does not decide what to build or implement it.\n- review-feedback-resolution — Resolve incoming review feedback (PR comments, code/architecture/security review findings, or audits) against repository evidence: disposition each item and apply only accepted fixes. Use when a review has returned comments to act on. Do not use to find defects (use code-review, security-review, or architecture-review); this skill receives findings, it does not generate them.\n- security-review — Perform a dedicated security vulnerability review of code, configuration, trust boundaries, or agent workflows, tracing untrusted input and privilege paths to exploitable sinks. Use when security risk is the requested deliverable — not merely because code under ordinary review touches auth, tokens, or secrets.\n- systematic-debugging — Diagnose a reproducible bug, test failure, build failure, integration failure, performance regression, or other unexpected behavior by finding its root cause before proposing or implementing a fix. Do not use for planned feature work without an observed failure.\n- threat-modeling — Build a repository-grounded threat model for an application, service, API, agent workflow, or architecture by mapping assets, actors, trust boundaries, entrypoints, attacker capabilities, abuse paths, and mitigations. Use only for explicit threat-model, attack-surface, DFD, STRIDE, PASTA, LINDDUN, or abuse-path requests; use security-review for ordinary vulnerability review. Report by default and do not probe external systems.\n\n=== USER REQUEST ===\nReview the unresolved comments on PR #47 and tell me which findings are valid, which are duplicates, and which I should push back on with evidence.\n"
