r an application, service, API, agent workflow, or architecture by mapping assets, actors, trust boundaries, entrypoints, attacker capabilities, abuse paths, and mitigations. Use only for explicit threat-model, attack-surface, DFD, STRIDE, PASTA, LINDDUN, or abuse-path requests; use security-review for ordinary vulnerability review. Report by default and do not probe external systems.\n\n=== USER REQUEST ===\nBefore we hand this repository to a new team, give the core modules a focused correctness once-over: flag real bugs, broken contracts between modules, and important behaviors nobody wrote a test for. Skip the big-picture design critique — the structure is staying as-is for now — and this isn't about hunting vulnerabilities either; I need an honest defect list with file references.\n"
      catalog_names_json: "[\\"adversarial-pr-review\\", \\"architecture-review\\", \\"code-review\\", \\"documentation-review\\", \\"frontend-quality-review\\", \\"implementation-planning\\", \\"review-feedback-resolution\\", \\"security-review\\", \\"systematic-debugging\\", \\"threat-modeling\\"]"
      expected_skill: "code-review"
