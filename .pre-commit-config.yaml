repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: validate-repository
        name: validate-repository
        entry: .venv/bin/python scripts/validate_repository.py
        language: system
        pass_filenames: false
        always_run: true
      - id: public-hygiene
        name: public-hygiene
        entry: .venv/bin/python scripts/public_hygiene_check.py
        language: system
        pass_filenames: false
        always_run: true
      - id: markdownlint
        name: markdownlint
        entry: node node_modules/markdownlint-cli2/markdownlint-cli2-bin.mjs
        language: system
        pass_filenames: false
        always_run: true
