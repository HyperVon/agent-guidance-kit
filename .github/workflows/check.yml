name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt
      - name: Validate skill catalog
        run: python scripts/validate_catalog.py
      - name: Run static validator tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -q
      - name: Lint static tooling
        run: ruff check scripts/
      - name: Check pull request patch whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
      - name: Check push patch whitespace
        if: github.event_name == 'push'
        run: git diff --check "${{ github.event.before }}...${{ github.sha }}"
